name: CI

# Runs on every push to ``main`` and every PR targeting it. ``workflow_dispatch``
# lets us re-trigger from the GitHub UI without faking a commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same branch when new commits land - saves
# Action minutes and avoids racing two deploys on Render.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest (with testcontainers-managed Postgres)
        # GitHub-hosted Ubuntu runners ship Docker, so the testcontainers
        # fixture can spin up pgvector/pgvector:pg16 on the fly. The
        # coverage gate (--cov-fail-under=90) lives in pyproject.toml.
        run: pytest

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: docs-rag-api:ci
          # GH cache makes subsequent CI builds ~30s instead of ~3 min.
          cache-from: type=gha
          cache-to: type=gha,mode=max
