# Render Blueprint - "Infrastructure as code" for Render.
#
# Notes:
# * We deploy from Docker (./Dockerfile) so the runtime is reproducible.
# * Render's hosted Postgres no longer has a free tier, so this blueprint
#   only provisions the web service - the user wires DATABASE_URL to an
#   external Postgres+pgvector (Neon's free tier is the recommended
#   choice; instructions are in the README).
# * GEMINI_API_KEY and DATABASE_URL are marked ``sync: false`` so they are
#   set manually in the Render dashboard rather than committed here.
# * JWT_SECRET_KEY is auto-generated by Render on first deploy and
#   preserved across subsequent deploys so existing JWTs stay valid.

services:
  - type: web
    name: docs-rag-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/ping
    # Run migrations before the new container starts taking traffic, so
    # we never serve a request against a schema the code doesn't expect.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      # External Postgres (Neon) - set the connection string from the
      # Render dashboard. Use the ``-pooler`` URL Neon provides if you
      # care about cold-start latency.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
